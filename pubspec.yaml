name: even_devices_native
description: Flutter adapter for the Flutter-free Even G2 Android and iOS SDKs.
version: 0.1.0-beta.11
homepage: https://www.evenrealities.com
repository: https://github.com/even-realities/flutter_enterprise_sdk
documentation: https://hub.evenrealities.com/docs/get-started/overview
publish_to: none

environment:
  sdk: ^3.5.3
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.evenrealities.even_devices_native
        pluginClass: EvenDevicesNativePlugin
      ios:
        pluginClass: EvenDevicesNativePlugin
