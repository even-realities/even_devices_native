group = "com.evenrealities.even_devices_native"
version = "0.1.0-beta.11"

buildscript {
    ext.kotlin_version = "2.1.10"
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath("com.android.tools.build:gradle:8.7.3")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version")
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: "com.android.library"
apply plugin: "kotlin-android"

// Resolve the standalone native SDK from the plugin package, without legacy Flutter BLE.
def nativeSdkRepository = uri("$projectDir/maven")
rootProject.allprojects {
    repositories { maven { url nativeSdkRepository } }
}

android {
    namespace = "com.evenrealities.even_devices_native"

    compileSdk = 36
    ndkVersion = "27.0.12077973"

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
    }

    defaultConfig {
        minSdk = 21
    }

}

dependencies {
    implementation "com.evenrealities.devices:even-devices-native-android:0.1.0-beta.11"
}
